<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Student Attendance</title>
    <style>
      /* Basic Reset and Styling */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f4f7f6;
        color: #333;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        background-color: #fff;
        width: 100%;
        max-width: 600px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #2c3e50;
      }

      /* Input Section */
      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      button {
        padding: 10px 15px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #2980b9;
      }

      /* List Section */
      ul {
        list-style-type: none;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background-color: #ecf0f1;
        margin-bottom: 10px;
        border-radius: 5px;
        border-left: 5px solid #3498db;
      }

      .student-name {
        font-weight: 500;
      }

      /* Status Toggle Buttons */
      .status-btn {
        padding: 6px 12px;
        font-size: 14px;
        border-radius: 4px;
        margin-left: 10px;
        border: none;
        cursor: pointer;
      }

      .present {
        background-color: #2ecc71;
        color: white;
      }

      .absent {
        background-color: #e74c3c;
        color: white;
      }

      .delete-btn {
        background-color: transparent;
        color: #95a5a6;
        font-size: 20px;
        padding: 0 10px;
      }

      .delete-btn:hover {
        color: #e74c3c;
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Attendance Tracker</h1>

      <div class="input-group">
        <label for="studentName">Student Name:</label>
        <input
          type="text"
          id="studentName"
          placeholder="Enter student name..."
        /input>
        <button onclick="addStudent()">Add Student</button>
      </div>

      <ul id="studentList">
        <!-- Students will be added here -->
      </ul>
    </div>

    <script>
      // Get the list container
      const studentList = document.getElementById("studentList");
      const inputField = document.getElementById("studentName");

      // Function to add a new student
      function addStudent() {
        const name = inputField.value.trim();

        if (name === "") {
          alert("Please enter a student name.");
          return;
        }

        // Create list item (li)
        const li = document.createElement("li");

        // Create name span
        const nameSpan = document.createElement("span");
        nameSpan.className = "student-name";
        nameSpan.textContent = name;

        // Create action container (buttons)
        const actionDiv = document.createElement("div");

        // Create Present button
        const presentBtn = document.createElement("button");
        presentBtn.className = "status-btn present";
        presentBtn.textContent = "Present";
        presentBtn.onclick = function () {
          presentBtn.style.opacity = "0.5";
          absentBtn.style.opacity = "1";
        };

        // Create Absent button
        const absentBtn = document.createElement("button");
        absentBtn.className = "status-btn absent";
        absentBtn.textContent = "Absent";
        absentBtn.style.opacity = "0.5"; // Default state
        absentBtn.onclick = function () {
          absentBtn.style.opacity = "0.5";
          presentBtn.style.opacity = "1";
        };

        // Create Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerHTML = "&times;"; // X symbol
        deleteBtn.onclick = function () {
          li.remove();
        };

        // Assemble elements
        actionDiv.appendChild(presentBtn);
        actionDiv.appendChild(absentBtn);
        actionDiv.appendChild(deleteBtn);

        li.appendChild(nameSpan);
        li.appendChild(actionDiv);

        // Add to list
        studentList.appendChild(li);

        // Clear input field
        inputField.value = "";
      }

      // Allow pressing "Enter" in the input field to add a student
      inputField.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          addStudent();
        }
      });
    </script>
  </body>
</html>
